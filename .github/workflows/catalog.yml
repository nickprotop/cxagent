name: catalog
# A PR touching plugins/plugins.json: verify every third-party entry, as a user's install would fetch
# it. First-party entries (with "directory") are skipped by verify and checked by PluginCatalogTests.
#
# READ-ONLY, AND NO SUBMITTED CODE RUNS: the released cxagent verifies, so a PR that edits verify's own
# source cannot change what checks it, and verify only downloads, hashes and reads the zips.
on:
  pull_request:
    paths:
      - 'plugins/plugins.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # A FLOOR, NOT A PIN: the newest release installs, but never one older than the release that
      # brought verify --https-only — which nuget.org can still be listing as the newest for a while
      # after a release, when the check would fail on an unknown option instead of saying why.
      - name: Install cxagent
        run: |
          dotnet tool install -g cxagent --version "[0.9.38,)"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Verify the catalog
        run: cxagent plugin verify --https-only plugins/plugins.json
