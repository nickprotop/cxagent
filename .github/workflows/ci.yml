name: ci
# ENABLE THESE WHEN THE PHASE LANDS. Left commented so the workflow exists, is reviewable, and fires
# nothing until someone decides it should:
#   push:
#     branches: [master]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: dotnet test --nologo
      # THE SUBMISSION BOT'S LOGIC, tested without opening an issue. Standard library only.
      - name: Test the submission script
        run: python3 -m unittest discover -s .github/scripts -v
      # THE FIXTURES THEMSELVES ARE COUNTED: a native test with no fixture returns early and reports
      # as passed, so a green suite alone cannot show the native path ran. FIND, NOT A GLOB, because
      # ls exits non-zero for a pattern that matches nothing.
      - name: Native fixtures were built
        run: |
          find cxagent.Tests/bin/Debug/net10.0 -maxdepth 1 -name 'fixture-*.so' | tee fixtures.txt
          built=$(wc -l < fixtures.txt)
          echo "fixtures built: $built"
          test "$built" -ge 8
      # THE ABI EXAMPLE IS THE HEADER'S ONLY EXECUTABLE PROOF. The doc comments in cxagent_plugin.h
      # are the whole specification a C author reads, and nothing else checks that a plugin written
      # against them compiles. A contract change that breaks the header should fail here.
      - name: Compile the ABI example
        run: |
          gcc -shared -fPIC -Icxagent.Core/sdk/c \
            -o /tmp/calculator_abi.so \
            cxagent.Core/examples/CalculatorAbiPlugin/calculator_abi.c
      # THE RELEASE'S OWN BUILD, FOR A RID THAT IS NOT THIS RUNNER'S. dotnet test builds portable, so a
      # break that only shows when cxagent is published self-contained and single-file for another
      # platform would otherwise surface on the tag, after the version is spent. osx-x64 because a
      # project that falls back to the build machine's RID still passes for linux-x64.
      - name: Publish the release build for another platform
        run: |
          dotnet restore cxagent/cxagent.csproj -r osx-x64
          dotnet publish cxagent/cxagent.csproj -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=true -o /tmp/publish-osx-x64
          test -f /tmp/publish-osx-x64/cxagent
