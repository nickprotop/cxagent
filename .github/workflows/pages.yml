name: Pages

# TWO TRIGGERS, ONE PATH. A release has fresh artifacts; a push to the site has none, and both
# download the current release's asset rather than trusting anything cached -- so a typo fix and a
# release publish identical catalogs. See the design doc, "Two triggers, one path".
#
# CALLED BY THE RELEASE, NOT TRIGGERED BY IT. A `release: published` trigger cannot fire here: the
# release is created by release.yml using the default GITHUB_TOKEN, and GitHub suppresses the events
# a workflow raises with that token so a workflow cannot trigger itself in a loop. The suppression
# is silent -- the release succeeds, no Pages run appears, and the site keeps serving the previous
# catalog until someone notices. release.yml calls this workflow directly instead.
on:
  workflow_call:
    inputs:
      release_tag:
        description: >-
          The release whose assets this catalog describes. Passed by release.yml, which knows the tag
          it just published — asking for "latest" from inside a release would be asking a question
          whose answer is still changing.
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'plugins/plugins.json'
      - 'COMMANDS.md'
      - 'CONFIG.md'
      - 'cxagent.Core/docs/plugins.md'
      # THE WALKTHROUGH AND ITS IMAGES. render_docs.py renders four documents and this list named
      # three, so an edit to the walkthrough — or a new screenshot in it — published only when some
      # OTHER trigger happened to fire. The screenshots reached the site at all because the commit
      # adding them also touched plugins.json.
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NEWEST WINS, AND A RUNNING DEPLOY IS NOT CANCELLED. Two deploys racing would be
# non-deterministic about which site survives; cancelling one mid-upload can leave Pages holding a
# partial artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # WHETHER THIS RUN PRODUCED A SITE AT ALL. The catalogue may list a plugin no release has
      # shipped yet — an ordinary state between merging a plugin and tagging the release that
      # carries it — and this job then deliberately builds nothing, keeping the published site as it
      # is rather than replacing it with one whose download 404s.
      #
      # THE DEPLOY JOB HAS TO SEE THAT. It only depends on `build` SUCCEEDING, and a deliberate
      # no-op is a success — so without this it runs, finds no artifact, and fails a push that did
      # exactly what it was designed to do.
      skipped: ${{ steps.shipped.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Render the three documents
        run: python3 site/build/render_docs.py --root . --out _site

      - name: Copy the authored pages
        # AFTER RENDERING, so an authored file always wins over a generated one of the same name.
        run: cp -r site/. _site/ && rm -rf _site/build

      - name: Decide which release this catalog describes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RESOLVED ONCE AND PINNED, because three separate "what is the latest release?" questions
          # can straddle a release that publishes mid-run and come back with three different answers:
          # the bytes from one, the asset list from another, the version from a third. The catalog
          # that comes out is internally inconsistent and passes every check in this file — the
          # failure surfaces later, as an installer refusing a plugin because the hash it was
          # promised is not the hash it downloaded.
          #
          # THE CALLER'S TAG WINS WHEN THERE IS ONE. release.yml has just published a release and
          # knows its tag; "latest" is not reliably that release yet, and a manual run dispatched
          # while a release is publishing races it outright — which is exactly how the published
          # catalog once ended up describing the previous release's zips.
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)
          fi

          echo "catalog describes release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download that release's plugin artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _artifact
          # THE ASSETS A USER WOULD ACTUALLY GET. Hashing anything else -- a local build, a previous
          # release -- would publish a value that does not match what the download URL serves.
          gh release download "${{ steps.release.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" \
              --pattern csharp-lsp.zip --pattern calculator.zip \
              --pattern clone-finder.zip --pattern triggers.zip --dir _artifact

      # A PLUGIN THAT HAS NOT SHIPPED YET IS NOT A BROKEN BUILD. The catalog entry lands on master
      # in one commit and the zip appears on the NEXT release, so between the two every Pages run
      # fails on an artifact that is missing exactly as expected — and a red that is expected is a
      # red nobody reads. The site keeps the catalog it already has, which stays TRUE: it describes
      # what is downloadable right now.
      #
      # ASKED OF THE RELEASE, NOT OF THE VERSION. A carried-forward plugin keeps an old version
      # number while its zip is very much on the current release, so comparing versions calls a
      # shipped plugin unshipped. What actually answers the question is whether the release lists
      # the asset: present but undownloaded is a broken run, absent entirely is a plugin still
      # waiting for its release.
      - name: Check every catalogued plugin actually shipped
        id: shipped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" --repo "${GITHUB_REPOSITORY}" --json assets \
              -q '.assets[].name' > /tmp/release-assets.txt
          echo "assets on the current release:"; sed 's/^/  /' /tmp/release-assets.txt

          MISSING=$(python3 - <<'PYCHECK'
          import json
          from pathlib import Path

          on_release = set(Path("/tmp/release-assets.txt").read_text().split())
          unshipped, broken = [], []

          for entry in json.load(open("plugins/plugins.json"))["plugins"]:
              if entry.get("source", {}).get("kind") != "release":
                  continue
              name = entry["name"]
              if Path(f"_artifact/{name}.zip").is_file():
                  continue
              # LISTED BUT NOT DOWNLOADED is a failure of this run; NOT LISTED AT ALL is a plugin
              # whose release has not happened yet.
              (broken if f"{name}.zip" in on_release else unshipped).append(name)

          if broken:
              print("BROKEN:" + ",".join(broken))
          elif unshipped:
              print("UNSHIPPED:" + ",".join(unshipped))
          PYCHECK
          )

          case "$MISSING" in
            BROKEN:*)
              echo "::error::the release lists ${MISSING#BROKEN:} but the download did not produce it"
              exit 1 ;;
            UNSHIPPED:*)
              echo "::notice::${MISSING#UNSHIPPED:} is not on the current release yet — the site keeps its existing catalog until one ships it."
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "every catalogued plugin has its artifact." ;;
          esac

      - name: Generate the catalog
        if: steps.shipped.outputs.skip != 'true'
        run: |
          # THE VERSION COMES FROM THE RELEASE THE ASSETS CAME FROM, not from the ref that
          # triggered this run: a push to master builds the site for whatever release is current,
          # and naming the ref would label those pages with a tag that has not shipped. It is the
          # tag resolved once at the top of this job, so the hashes, the asset list and the number
          # all describe one release rather than three answers to the same question.
          VERSION="${{ steps.release.outputs.tag }}"
          VERSION="${VERSION#v}"
          echo "cxagent version for the site: $VERSION"

          python3 site/build/catalog.py \
              --catalog plugins/plugins.json \
              --plugin csharp-lsp=_artifact/csharp-lsp.zip \
              --plugin calculator=_artifact/calculator.zip \
              --plugin clone-finder=_artifact/clone-finder.zip \
              --plugin triggers=_artifact/triggers.zip \
              --version "$VERSION" \
              --out _site/catalog.json

      # NOTHING TO PUBLISH IF THE CATALOG WAS SKIPPED. Uploading here would deploy a site whose
      # catalog.json is missing entirely — worse than the stale-but-true one already live.
      - uses: actions/upload-pages-artifact@v3
        if: steps.shipped.outputs.skip != 'true'
        with:
          path: _site

  deploy:
    needs: build
    # NOTHING TO DEPLOY IS NOT A FAILURE. See the `skipped` output above: when the catalogue names a
    # plugin the current release does not carry, build uploads no artifact on purpose, and deploying
    # is the one thing that must not happen — the site already serves the last good catalogue.
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
