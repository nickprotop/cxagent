name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            name: cxagent-linux-x64
          - rid: linux-arm64
            name: cxagent-linux-arm64
          - rid: osx-x64
            name: cxagent-osx-x64
          - rid: osx-arm64
            name: cxagent-osx-arm64
          - rid: win-x64
            name: cxagent-win-x64.exe
          - rid: win-arm64
            name: cxagent-win-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore cxagent/cxagent.csproj -r ${{ matrix.rid }}

      - name: Build
        run: |
          dotnet publish cxagent/cxagent.csproj -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./publish/${{ matrix.rid }}

      - name: Rename binary
        run: |
          if [ -f "./publish/${{ matrix.rid }}/cxagent.exe" ]; then
            mv ./publish/${{ matrix.rid }}/cxagent.exe ./publish/${{ matrix.rid }}/${{ matrix.name }}
          else
            mv ./publish/${{ matrix.rid }}/cxagent ./publish/${{ matrix.rid }}/${{ matrix.name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ./publish/${{ matrix.rid }}/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate checksums
        run: |
          # STAGE INSTALL SCRIPTS AS ASSETS, matching cxpost/cxnet. They live in the repo and the
          # release notes tell users to curl them from raw.githubusercontent — which pins them to
          # whatever master happens to be, not to the release they are installing. cxshell's app
          # manager needs them ON THE RELEASE, so a version can be installed by its own scripts.
          mkdir -p release
          for dir in ./artifacts/*/; do
            cp "$dir"/cxagent-* release/ 2>/dev/null || true
          done
          cp install.sh install.ps1 uninstall.sh uninstall.ps1 release/
          chmod +x release/cxagent-* release/*.sh 2>/dev/null || true

          # Checksums cover the scripts too: an installer fetched from a release is exactly the kind
          # of thing worth being able to verify.
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## Install

            **Linux / macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/nickprotop/cxagent/master/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/nickprotop/cxagent/master/install.ps1 | iex
            ```

            ## Manual Download

            | Platform | Binary |
            |----------|--------|
            | Linux x64 | `cxagent-linux-x64` |
            | Linux ARM64 | `cxagent-linux-arm64` |
            | macOS x64 (Intel) | `cxagent-osx-x64` |
            | macOS ARM64 (Apple Silicon) | `cxagent-osx-arm64` |
            | Windows x64 | `cxagent-win-x64.exe` |
            | Windows ARM64 | `cxagent-win-arm64.exe` |

            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Checksums

            See `SHA256SUMS` in the release assets.
          draft: false
          prerelease: false

  # THE LIBRARY, TO NUGET.ORG. Same tag, same version — the package a consumer references and the
  # binary a user downloads come from one commit, so "which cxagent is this Core from?" has an
  # answer.
  #
  # TRUSTED PUBLISHING (OIDC) RATHER THAN AN API KEY. NuGet mints a short-lived token for this
  # workflow on this repository; there is no long-lived secret to leak, rotate, or forget. The
  # `id-token: write` permission below is what lets the runner request it, and it must be granted
  # per job — the workflow-level `contents: write` above does not cover it.
  #
  # NEEDS THE RELEASE JOB so a failed build never publishes a version that cannot be unpublished.
  # NuGet allows unlisting, never reuse: a version pushed by mistake burns that number permanently.
  nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # THE TESTS GATE THE PACKAGE. The release job builds binaries and does not run them; a library
      # published broken is worse than a binary published broken, because a consumer's build breaks
      # rather than their session.
      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: |
          dotnet pack cxagent.Core/cxagent.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkg

      # WHAT IS ACTUALLY IN IT, in the log. The README and docs/ are packed by an ItemGroup that a
      # future edit could silently drop, and a package whose links all 404 looks fine from here.
      - name: Show package contents
        run: unzip -l ./nupkg/*.nupkg

      # ONE-TIME SETUP ON NUGET.ORG, and this job fails until it is done:
      #   1. nuget.org → account → Trusted Publishing → add a policy for
      #      owner `nickprotop`, package `CxAgent.Core`, repository `nickprotop/cxagent`,
      #      workflow `release.yml`.
      #   2. this repository → Settings → Secrets and variables → Actions → Variables →
      #      add `NUGET_USER` with your nuget.org username.
      # A policy is bound to the repository and workflow file, so a fork cannot publish and a
      # renamed workflow stops working rather than silently using someone else's identity.
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
