name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            name: cxagent-linux-x64
          - rid: linux-arm64
            name: cxagent-linux-arm64
          - rid: osx-x64
            name: cxagent-osx-x64
          - rid: osx-arm64
            name: cxagent-osx-arm64
          - rid: win-x64
            name: cxagent-win-x64.exe
          - rid: win-arm64
            name: cxagent-win-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore cxagent/cxagent.csproj -r ${{ matrix.rid }}

      - name: Build
        run: |
          dotnet publish cxagent/cxagent.csproj -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./publish/${{ matrix.rid }}

      - name: Rename binary
        run: |
          if [ -f "./publish/${{ matrix.rid }}/cxagent.exe" ]; then
            mv ./publish/${{ matrix.rid }}/cxagent.exe ./publish/${{ matrix.rid }}/${{ matrix.name }}
          else
            mv ./publish/${{ matrix.rid }}/cxagent ./publish/${{ matrix.rid }}/${{ matrix.name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ./publish/${{ matrix.rid }}/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # ONE ARTIFACT, NOT SIX. csharp-lsp is a plain net10.0 library with no RuntimeIdentifier — it
      # is portable MSIL, so the same file runs on every platform the binaries above are built for.
      # Putting it in the RID matrix would upload six identical copies under six names.
      #
      # NOT PART OF THE BINARY. A plugin the user has not asked for should not arrive inside the
      # thing they installed; this ships beside it, and install.sh places it where discovery looks.
      # cxagent then announces it as present-but-unconfigured rather than loading it.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # BUILT ONLY WHEN THE PLUGIN CHANGED. A release that ships an identical plugin ships the
      # PREVIOUS release's zip, byte for byte, so its version keeps meaning "the plugin's contract"
      # rather than drifting into "how many cxagent releases have happened". Every release still
      # carries the asset, so install.sh can always fetch it from the tag it is installing.
      #
      # THE VERSION ITSELF IS SET BY publish.sh, before the tag exists — so the tag contains the
      # right version rather than having one committed into it afterwards. This step only reads it.
      - name: Build or carry forward the csharp-lsp plugin
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          SIDECAR=plugins/csharp-lsp/csharp-lsp.plugin.json
          VERSION=$(python3 -c "import json;print(json.load(open('$SIDECAR'))['version'])")

          mkdir -p plugin-out

          # WHAT THE PLUGIN IS BUILT FROM, NOT ONLY WHAT IT IS. The carry-forward exists so an
          # untouched plugin keeps a stable hash — a rebuild embeds source paths and mtimes, so
          # identical source produces a different zip. But the plugin binds to the contract
          # assembly, and a change THERE changes the binary while leaving plugins/csharp-lsp/
          # untouched. Carrying forward across that ships a plugin built against an assembly this
          # release no longer has.
          PLUGIN_INPUTS="plugins/csharp-lsp/ cxagent.Plugins.Abstractions/"

          if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" HEAD -- $PLUGIN_INPUTS; then
            echo "plugin unchanged since $PREV_TAG — carrying its zip forward."

            # THE SAME BYTES, NOT A REBUILD. A rebuild would produce a different hash for identical
            # source: the assembly embeds its own source paths, and the zip embeds file mtimes.
            # Re-uploading the exact artifact keeps the plugin's identity stable across releases.
            if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/$PREV_TAG/csharp-lsp.zip" \
                 -o plugin-out/csharp-lsp.zip; then
              echo "carried forward from $PREV_TAG"
              exit 0
            fi

            echo "no zip on $PREV_TAG — building instead."
          fi

          echo "building csharp-lsp $VERSION"

          # BUILD, NOT PUBLISH. The plugin references CxAgent.Core with Private="false" and resolves
          # it from the host at run time, so a publish would drag AngleSharp, SQLite and its native
          # runtimes into an output that ships two files.
          dotnet build plugins/csharp-lsp/csharp-lsp.csproj -c Release -o ./plugin-build \
            -p:Version="$VERSION"

          # THE SIDECAR TRAVELS WITH THE DLL, always. It is read BEFORE the assembly is loaded — it
          # is what the load prompt shows and what discovery reports without running anything — so a
          # zip missing it produces a plugin that cannot load and cannot be described.
          test -f ./plugin-build/csharp-lsp.dll
          test -f ./plugin-build/csharp-lsp.plugin.json

          # THE README TRAVELS TOO, so an installed plugin carries its own documentation. The manager
          # renders it from disk; the catalog cannot supply one, and a plugin whose docs live only in
          # a repository is a plugin a user reads about by leaving cxagent.
          test -f ./plugin-build/README.md

          (cd plugin-build && zip -q ../plugin-out/csharp-lsp.zip \
             csharp-lsp.dll csharp-lsp.plugin.json README.md)

      # THE SAME BUILD-OR-CARRY SCHEME AS csharp-lsp ABOVE, for the same reasons: an untouched
      # plugin keeps its previous zip byte for byte because a rebuild embeds source paths and
      # mtimes and would move the hash for identical source, and the inputs include the contract
      # assembly because a change there alters the binary while leaving plugins/calculator/
      # untouched.
      - name: Build or carry forward the calculator plugin
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          SIDECAR=plugins/calculator/calculator.plugin.json
          VERSION=$(python3 -c "import json;print(json.load(open('$SIDECAR'))['version'])")

          mkdir -p plugin-out

          PLUGIN_INPUTS="plugins/calculator/ cxagent.Plugins.Abstractions/"

          if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" HEAD -- $PLUGIN_INPUTS; then
            echo "plugin unchanged since $PREV_TAG — carrying its zip forward."

            if curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/$PREV_TAG/calculator.zip" \
                 -o plugin-out/calculator.zip; then
              echo "carried forward from $PREV_TAG"
              exit 0
            fi

            echo "no zip on $PREV_TAG — building instead."
          fi

          echo "building calculator $VERSION"

          dotnet build plugins/calculator/calculator.csproj -c Release -o ./calc-build \
            -p:Version="$VERSION"

          # Jace.dll IS PART OF THE LOAD SET. Assembly.LoadFrom resolves the plugin's dependencies
          # from the plugin's own folder, so a zip missing it produces a plugin that fails only
          # when a user tries to load it — nothing else in this pipeline would notice.
          test -f ./calc-build/calculator.dll
          test -f ./calc-build/Jace.dll
          test -f ./calc-build/calculator.plugin.json
          test -f ./calc-build/README.md

          (cd calc-build && zip -q ../plugin-out/calculator.zip \
             calculator.dll Jace.dll calculator.plugin.json README.md)

      - name: Generate checksums
        run: |
          # STAGE INSTALL SCRIPTS AS ASSETS, matching cxpost/cxnet. They live in the repo and the
          # release notes tell users to curl them from raw.githubusercontent — which pins them to
          # whatever master happens to be, not to the release they are installing. cxshell's app
          # manager needs them ON THE RELEASE, so a version can be installed by its own scripts.
          mkdir -p release
          for dir in ./artifacts/*/; do
            cp "$dir"/cxagent-* release/ 2>/dev/null || true
          done
          cp install.sh install.ps1 uninstall.sh uninstall.ps1 release/
          chmod +x release/cxagent-* release/*.sh 2>/dev/null || true

          # THE PLUGIN ZIPS, built or carried forward by the steps above.
          cp plugin-out/csharp-lsp.zip release/
          cp plugin-out/calculator.zip release/

          # Checksums cover the scripts too: an installer fetched from a release is exactly the kind
          # of thing worth being able to verify.
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## Install

            **Linux / macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/nickprotop/cxagent/master/install.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/nickprotop/cxagent/master/install.ps1 | iex
            ```

            **.NET tool** (uses the .NET you already have, rather than carrying its own):
            ```bash
            dotnet tool install -g cxagent
            ```

            **Embedding it** — the library half is on NuGet, targeting net8.0, net9.0 and net10.0:
            ```bash
            dotnet add package CxAgent.Core
            ```

            ## Manual Download

            | Platform | Binary |
            |----------|--------|
            | Linux x64 | `cxagent-linux-x64` |
            | Linux ARM64 | `cxagent-linux-arm64` |
            | macOS x64 (Intel) | `cxagent-osx-x64` |
            | macOS ARM64 (Apple Silicon) | `cxagent-osx-arm64` |
            | Windows x64 | `cxagent-win-x64.exe` |
            | Windows ARM64 | `cxagent-win-arm64.exe` |

            ## Plugins

            `csharp-lsp.zip` — C# go-to-definition, find-references and diagnostics, from a
            language server. The install script places it for you; it is **not enabled** until you
            say so, and cxagent tells you it is there. Needs a C# language server:
            `dotnet tool install -g csharp-ls`.

            `calculator.zip` — exact arithmetic as one tool: a whole expression in, the exact
            result out. Needs nothing, and is likewise **not enabled** until you say so.

            To install one by hand, unzip it into its own folder under
            `~/.config/cxagent/plugins/` — csharp-lsp ships three files, the calculator four.

            **An installed csharp-lsp asks its load prompt once more after this update**: its
            README now travels in the zip, so it joins the plugin's load set and the hash the
            prompt shows covers it. That is the gate noticing a real change, not a fault.

            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Checksums

            See `SHA256SUMS` in the release assets.
          draft: false
          prerelease: false

  # THE SITE, REBUILT SO THE CATALOG DESCRIBES THIS RELEASE. The catalog commits sha256: null and
  # gets its hashes stamped from the release's own assets, so until the site is rebuilt the published
  # catalog still points at the previous release's zips — a user installing a plugin gets the old
  # version, or a hash mismatch if the asset moved.
  #
  # CALLED, NOT TRIGGERED. pages.yml cannot listen for `release: published` here: this workflow
  # creates the release with the default GITHUB_TOKEN, and GitHub suppresses the events a workflow
  # raises with that token, so nothing would ever fire. Calling it is the fix, and it keeps ONE
  # definition of how the catalog is built rather than a copy that drifts from the original.
  #
  # NEEDS THE RELEASE JOB, because the assets it downloads have to exist first.
  #
  # AND THE github-pages ENVIRONMENT MUST ALLOW TAGS. Its deployment branch policy gates the deploy
  # before any step runs, so a policy listing only `master` fails this job on a tag with an empty
  # step list and no error text — the build succeeds, the deploy is refused, and the site silently
  # keeps the previous catalog. A `v*` tag policy is what makes this job able to publish at all.

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # THE LIBRARY, TO NUGET.ORG. Same tag, same version — the package a consumer references and the
  # binary a user downloads come from one commit, so "which cxagent is this Core from?" has an
  # answer.
  #
  # TRUSTED PUBLISHING (OIDC) RATHER THAN AN API KEY. NuGet mints a short-lived token for this
  # workflow on this repository; there is no long-lived secret to leak, rotate, or forget. The
  # `id-token: write` permission below is what lets the runner request it, and it must be granted
  # per job — the workflow-level `contents: write` above does not cover it.
  #
  # NEEDS THE RELEASE JOB so a failed build never publishes a version that cannot be unpublished.
  # NuGet allows unlisting, never reuse: a version pushed by mistake burns that number permanently.

  nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # THE TESTS GATE THE PACKAGE. The release job builds binaries and does not run them; a library
      # published broken is worse than a binary published broken, because a consumer's build breaks
      # rather than their session.
      # THE TEST PROJECT, NOT THE SOLUTION. cxagent.slnx lists a sibling that lives OUTSIDE this
      # repository — ../ConsoleEx/SharpConsoleUI — which exists on a developer's machine and never
      # on a runner. The csprojs handle that with Condition="Exists(...)" and fall back to the
      # published SharpConsoleUI package; a .slnx has no such conditional, so building the solution
      # on CI fails with MSB3202 before a single test runs.
      #
      # MEASURED, on the first tag that used this job: the whole suite passed locally and the same
      # command failed on the runner for a reason that had nothing to do with the code. Naming the
      # test project reaches the same 2,046 tests through references that DO fall back.
      - name: Test
        run: dotnet test cxagent.Tests/cxagent.Tests.csproj --configuration Release

      # TWO PACKAGES, ONE JOB. CxAgent.Core is the library; cxagent is the same app the binaries
      # above carry, packaged as `dotnet tool install -g cxagent` for developers who already have
      # the SDK. They share this job because they share a version, a tag and one trusted-publishing
      # identity — a second job would be a second place for those to drift apart.
      - name: Pack
        run: |
          dotnet pack cxagent.Core/cxagent.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkg

          dotnet pack cxagent/cxagent.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkg

      # WHAT IS ACTUALLY IN IT, in the log. The README and docs/ are packed by an ItemGroup that a
      # future edit could silently drop, and a package whose links all 404 looks fine from here.
      # ONE unzip PER PACKAGE. `unzip -l ./nupkg/*.nupkg` lists only the FIRST archive and says
      # nothing about the rest — so with two packages this step showed CxAgent.Core's lib/ folders
      # and hid the tool entirely, which is the exact blindness it was added to prevent.
      - name: Show package contents
        run: |
          for p in ./nupkg/*.nupkg; do
            echo "=== $p"
            unzip -l "$p"
          done

      # ONE-TIME SETUP ON NUGET.ORG, and this job fails until it is done:
      #   1. nuget.org → account → Trusted Publishing → add a policy for
      #      owner `nickprotop`, repository `nickprotop/cxagent`, workflow `release.yml`.
      #      A GLOB IN THE PACKAGE PATTERN (`cxagent*`) covers both packages this job pushes —
      #      CxAgent.Core and cxagent, the dotnet tool — so one policy is enough. Without a glob a
      #      policy is per-package, and a missing one fails that package's push alone, after the
      #      other has landed; --skip-duplicate makes the re-run safe either way.
      #   2. `gh variable set NUGET_USER --repo nickprotop/cxagent --body "<nuget.org user>"`
      #      (done: nickprotop). gh can set the variable; it cannot create the policy in step 1,
      #      which lives on nuget.org and has no CLI.
      # If the policy form rejects CxAgent.Core because it does not exist yet, push once by hand
      # with a temporary API key to claim the ID, then add the policy for every release after.
      # A policy is bound to the repository and workflow file, so a fork cannot publish and a
      # renamed workflow stops working rather than silently using someone else's identity.
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # THE GLOB COVERS BOTH PACKAGES. --skip-duplicate makes a re-run after a partial failure safe:
      # whichever package already landed is skipped rather than failing the job.
      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # THE AUR PACKAGE, regenerated from the tag and pushed to aur.archlinux.org.
  #
  # NEEDS THE RELEASE JOB, because the PKGBUILD's sha256sums come from the binaries that job
  # published — computing them before the assets exist would pin hashes of nothing.
  #
  # ONE-TIME SETUP, and this job is skipped until it is done:
  #   1. Create the package once by hand: clone ssh://aur@aur.archlinux.org/cxagent-bin.git,
  #      add the PKGBUILD and .SRCINFO from packaging/aur/, push. The AUR creates a package on
  #      first push; there is no API to create one.
  #   2. Add an SSH key to your AUR account (Account → SSH Public Key), and put the PRIVATE half in
  #      this repository's secrets as AUR_SSH_KEY.
  # The `if` below means a fork, or this repo before setup, skips rather than fails.
  aur:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'nickprotop/cxagent' }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # THE HASHES COME FROM THE RELEASE'S OWN SHA256SUMS, not from a re-download and re-hash. That
      # file is what a user is told to verify against, so pinning anything else here would let the
      # package and the published checksums disagree.
      - name: Regenerate PKGBUILD and .SRCINFO
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/nickprotop/cxagent"
          curl -fsSL -o SHA256SUMS "$BASE/releases/download/v$V/SHA256SUMS"
          X64=$(awk '/cxagent-linux-x64$/  {print $1}' SHA256SUMS)
          ARM=$(awk '/cxagent-linux-arm64$/{print $1}' SHA256SUMS)
          LIC=$(curl -fsSL "$BASE/raw/v$V/LICENSE" | sha256sum | cut -d' ' -f1)

          # EMPTY MEANS THE ASSET NAMES CHANGED. Failing here is the point: a silently empty hash
          # would publish a PKGBUILD that cannot verify anything.
          test -n "$X64" && test -n "$ARM" && test -n "$LIC"

          sed -i \
            -e "s/^pkgver=.*/pkgver=$V/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$X64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$ARM')/" \
            -e "s/^sha256sums=.*/sha256sums=('$LIC')/" \
            packaging/aur/PKGBUILD

          sed -i \
            -e "s/\tpkgver = .*/\tpkgver = $V/" \
            -e "s/\tpkgrel = .*/\tpkgrel = 1/" \
            -e "s|LICENSE-[0-9.]*::|LICENSE-$V::|" \
            -e "s|cxagent-bin-[0-9.]*-x86_64::|cxagent-bin-$V-x86_64::|" \
            -e "s|cxagent-bin-[0-9.]*-aarch64::|cxagent-bin-$V-aarch64::|" \
            -e "s|/v[0-9.]*/LICENSE|/v$V/LICENSE|" \
            -e "s|/download/v[0-9.]*/|/download/v$V/|g" \
            packaging/aur/.SRCINFO

          # .SRCINFO's hashes are order-dependent, so rewrite them positionally rather than by name.
          python3 - "$X64" "$ARM" "$LIC" <<'PY'
          import re, sys
          x64, arm, lic = sys.argv[1:4]
          p = 'packaging/aur/.SRCINFO'
          s = open(p).read()
          s = re.sub(r'(\tsha256sums = )[0-9a-f]{64}', r'\g<1>' + lic, s)
          s = re.sub(r'(\tsha256sums_x86_64 = )[0-9a-f]{64}', r'\g<1>' + x64, s)
          s = re.sub(r'(\tsha256sums_aarch64 = )[0-9a-f]{64}', r'\g<1>' + arm, s)
          open(p, 'w').write(s)
          PY

          grep -E "^pkgver|^sha256sums" packaging/aur/PKGBUILD

      - name: Publish to the AUR
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "AUR_SSH_KEY is not set — skipping. See the setup note in this workflow."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'CFG'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking yes
          CFG

          git clone ssh://aur@aur.archlinux.org/cxagent-bin.git aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          cd aur-repo
          git -c user.name="cxagent release" -c user.email="noreply@github.com" \
              commit -am "cxagent-bin $V" || { echo "nothing changed"; exit 0; }
          git push
