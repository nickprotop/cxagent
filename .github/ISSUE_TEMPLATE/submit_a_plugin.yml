name: Submit a plugin
description: List a plugin in the marketplace catalog. A bot checks the entry and opens the pull request.
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: >
        Paste the `<name>.catalog.json` that `cxagent plugin pack` wrote, after putting each zip's
        https URL into it and running `cxagent plugin verify --https-only` on it. A bot runs the
        same check here, comments the result, and opens the pull request adding the entry. Editing
        this issue checks it again. See
        [Publishing a plugin](https://github.com/nickprotop/cxagent/blob/master/cxagent.Core/docs/publishing-plugins.md).


        Review asks whether this entry is truthful and useful — that the plugin exists, its entry
        matches its sidecar, and its description is honest. It is not a security review: cxagent
        asks before loading any plugin, showing a hash of everything it would load, and that is the
        boundary a user relies on.

  - type: textarea
    id: entry
    attributes:
      label: Catalog entry
      description: The whole `<name>.catalog.json`, as pack wrote it with its URLs filled in.
      render: json
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Anything a user must install separately (a language server, a CLI tool), or anything else a reviewer should know.
    validations:
      required: false
