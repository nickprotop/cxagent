<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>cxagent</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/hljs-themes.css">
<script src="/vendor/highlight.min.js"></script>
</head>
<body data-view="list">
<div id="banners" class="banners"></div>
<header class="topbar">
  <button id="menu" class="icon only-tablet" type="button" aria-label="Sessions">☰</button>
  <span class="brand">cxagent</span>
  <span id="crumb" class="crumb"></span>
  <span class="spacer"></span>
  <label class="pick" id="pick-model" hidden><span class="pick-dot"></span><select id="model" aria-label="Model"></select></label>
  <label class="pick" id="pick-mode" hidden><select id="mode" aria-label="Edit mode"></select></label>
  <label class="pick" id="pick-sandbox" hidden><select id="sandbox" aria-label="Sandbox"></select></label>
  <span id="conn" class="conn" title="Connected"></span>
  <button id="panel-toggle" class="icon" type="button" aria-label="Side panel" title="Side panel">◧</button>
  <button id="theme" class="icon" type="button" aria-label="Light or dark" title="Light or dark">◐</button>
  <form method="post" action="/logout" class="logout"><button type="submit" class="ghost">Log out</button></form>
</header>
<div class="layout">
  <aside id="sidebar" class="sidebar">
    <button id="new" class="new" type="button">+ New session</button>
    <div id="sessions" class="sessions"></div>
  </aside>
  <main class="main">
    <nav id="tabs" class="tabs"></nav>
    <div class="phonebar">
      <button id="back" class="icon" type="button" aria-label="Back">‹</button>
      <b id="phone-title"></b>
      <button id="phone-panel" class="icon" type="button" aria-label="Side panel">◧</button>
    </div>
    <div id="worker-head" class="worker-head" hidden></div>
    <div id="chat" class="chat">
      <div id="empty" class="empty">
        <div class="empty-mark">cxagent</div>
        <p>Pick a session, or start a new one.</p>
      </div>
    </div>
    <div id="prompts" class="prompts"></div>
    <form id="composer" class="composer" autocomplete="off">
      <div id="completion" class="completion" hidden></div>
      <textarea id="input" rows="1" placeholder="Message, or / for commands" disabled></textarea>
      <button id="stop" type="button" class="stop" hidden>Stop</button>
      <button id="send" type="submit" class="send" disabled>Send</button>
    </form>
    <footer id="statusline" class="statusline"></footer>
  </main>
  <aside id="panel" class="panel">
    <div class="panel-tabs">
      <button type="button" class="ptab on" data-pane="session">Session</button>
      <button type="button" class="ptab" data-pane="tasks">Tasks <span id="tasks-count" class="count" hidden></span></button>
      <span class="spacer"></span>
      <button id="panel-close" class="icon" type="button" aria-label="Close panel">×</button>
    </div>
    <div id="pane-session" class="pane"></div>
    <div id="pane-tasks" class="pane" hidden></div>
  </aside>
</div>
<div id="scrim" class="scrim"></div>
<div id="picker" class="picker" hidden>
  <div class="picker-box">
    <div class="picker-head"><b>New session in…</b><button id="picker-close" type="button" class="icon" aria-label="Close">×</button></div>
    <div id="picker-path" class="picker-path"></div>
    <div id="picker-list" class="picker-list"></div>
    <div class="picker-foot"><button id="picker-up" type="button" class="ghost">Up</button><span class="spacer"></span><button id="picker-open" type="button" class="primary">Open here</button></div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
