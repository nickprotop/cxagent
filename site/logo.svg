  <path d="M20.00 8.45 L25.46 11.60 L25.46 17.90 L20.00 21.05 L14.54 17.90 L14.54 11.60 Z" fill="#fcd34d" stroke="#fcd34d" stroke-width="0.9" stroke-linejoin="round"/><path d="M13.94 18.95 L19.39 22.10 L19.39 28.40 L13.94 31.55 L8.48 28.40 L8.48 22.10 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="0.9" stroke-linejoin="round"/><path d="M26.06 18.95 L31.52 22.10 L31.52 28.40 L26.06 31.55 L20.61 28.40 L20.61 22.10 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
