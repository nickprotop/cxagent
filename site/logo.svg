<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="cxagent">
  <!-- Three cells of one honeycomb: agents building one thing together. The top cell is lighter because
     it is still being built — the one an agent is working on now. -->
