<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A terminal, which is what cxagent is: a prompt and a caret. Drawn rather than lettered
       because two glyphs at 16px are a smudge. -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <path d="M7 10.5 L13 16 L7 21.5" fill="none" stroke="#3ddc84" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="19.4" width="9" height="2.4" rx="1.2" fill="#3ddc84"/>
</svg>
