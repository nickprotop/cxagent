<script>
/* BEFORE THE STYLESHEET PAINTS ANYTHING: a reader who chose a theme gets it on the first frame
   rather than after a flash of the other one. site.js owns the toggle; this only applies the choice. */
try { var t = localStorage.getItem("cxagent-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
